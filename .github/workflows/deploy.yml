name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate, test, and build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.16.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run unit and browser tests
        run: npm test
      - name: Verify publishable artifact
        run: npm run verify:dist
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Verify deployed site
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Check public pages and resources
        shell: bash
        run: |
          paths=(
            ""
            "es/"
            "en/"
            "es/projects/"
            "en/projects/"
            "es/cv/"
            "en/cv/"
            "assets/cv/malvicino-es.pdf"
            "assets/cv/malvicino-en.pdf"
            "assets/images/branding/logo.webp"
            "robots.txt"
            "sitemap.xml"
          )

          for path in "${paths[@]}"; do
            url="${SITE_URL%/}/${path}"
            echo "Checking ${url}"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 10 --retry-all-errors \
              --output /dev/null "${url}"
          done
